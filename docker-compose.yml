services:

  backend:
    build: ./Server
    command: node --watch app.js
    ports:
      - "8080:8080"
    env_file:
      - ./Server/.env
    volumes:
      - ./Server:/app
      - /app/node_modules
    depends_on:
      - redis

  worker:
    build: ./Server
    command: node --watch workers/bookingWorker.js
    env_file:
      - ./Server/.env
    volumes:
      - ./Server:/app
      - /app/node_modules
    depends_on:
      - redis

  frontend:
    image: node:22.12.0
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  redis:
    image: redis:7
    ports:
      - "6379:6379"